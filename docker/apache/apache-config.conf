<VirtualHost *:80>
    ServerName localhost  # Adiciona isso pra sumir com o aviso de ServerName

    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options FollowSymLinks       # remove o Indexes (melhor evitar listar diretórios)
        AllowOverride All
        Require all granted
    </Directory>

    DirectoryIndex index.php index.html  # Garante que index.php será usado

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
